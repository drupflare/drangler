worker_processes 1;
events { worker_connections 256; }

http {
	resolver 127.0.0.11 valid=2s ipv6=off;

	map $host $drupal_upstream {
		default drupal;
		empty.fixture.localhost drupal-empty;
	}

	server {
		listen 80;
		location / {
			set $up $drupal_upstream;
			proxy_pass http://$up:80;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_read_timeout 120s;
			client_max_body_size 64m;
		}
	}

	server {
		listen 8281;
		add_header Retry-After 30 always;
		location / { return 503 "fixture: service unavailable\n"; }
	}

	server {
		listen 8282;
		add_header Retry-After 30 always;
		location / { return 503 "fixture: service unavailable\n"; }
	}
}

stream {
	resolver 127.0.0.11 valid=2s ipv6=off;

	server {
		listen 2022;
		set $up drupal:22;
		proxy_pass $up;
	}

	server {
		listen 2023;
		set $up drupal-empty:22;
		proxy_pass $up;
	}
}

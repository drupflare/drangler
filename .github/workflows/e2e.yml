name: Integration (E2E)

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: What the Diff Touches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      source: ${{ steps.filter.outputs.source }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          filters: |
            source:
              - 'src/commands/doctor.ts'
              - 'src/health/**'
              - 'src/migrate/**'
              - 'docker/**'
              - 'tests/e2e/**'
              - '.github/workflows/e2e.yml'

  clone:
    name: Live Clone
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      REQUIRE_CLONE: '1'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build a Workspace from the Published Repository
        run: bun run test:e2e:clone

  integration:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      REQUIRE_DOCKER: '1'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Cache Docker Images
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          key: docker-${{ runner.os }}-${{ hashFiles('docker/compose.yml') }}
      - name: Load or Pull Docker Images
        run: |
          if [ -f /tmp/docker-images/images.tar ]; then
            docker load -i /tmp/docker-images/images.tar
          else
            docker compose -f docker/compose.yml pull
            mkdir -p /tmp/docker-images
            docker compose -f docker/compose.yml config --images | sort -u | xargs docker save -o /tmp/docker-images/images.tar
          fi
      - name: Run Integration Suite with Coverage
        run: bun run test:e2e:coverage
      - name: Upload Coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: drupflare/drangler
          fail_ci_if_error: false
          report_type: coverage
          flags: integration
          files: coverage/clover.xml
      - name: Dump Container Logs on Failure
        if: ${{ failure() }}
        run: docker compose -f docker/compose.yml logs --no-color --tail=400
      - name: Teardown Containers
        if: ${{ always() }}
        run: docker compose -f docker/compose.yml down -v --remove-orphans

  broken:
    name: Broken VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.source == 'true' }}

    permissions:
      contents: read

    env:
      REQUIRE_DOCKER: '1'
      REQUIRE_BROKEN: '1'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Bring Up the Broken Arm
        run: bun tests/e2e/stack.ts broken
      - name: Run the Source Doctor Suite
        run: bunx vitest run --project=e2e tests/e2e/doctor-source.spec.ts
      - name: Dump Container Logs on Failure
        if: ${{ failure() }}
        run: docker compose -f docker/compose.yml --profile broken logs --no-color --tail=400
      - name: Teardown Containers
        if: ${{ always() }}
        run: docker compose -f docker/compose.yml --profile broken down -v --remove-orphans

  worker:
    name: Real Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: read

    env:
      REQUIRE_CLONE: '1'
      REQUIRE_WORKER: '1'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run the Repair Envelope Suite
        run: bunx vitest run --project=e2e tests/e2e/heal-real.spec.ts tests/e2e/heal.spec.ts

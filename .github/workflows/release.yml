name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''
      skip_npm:
        type: boolean
        description: 'Skip npmjs'
        default: false
      skip_github_npm:
        type: boolean
        description: 'Skip GitHub Packages (npm)'
        default: false

jobs:
  binaries:
    name: Build the Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Compile Every Target
        run: |
          mkdir -p dist/build dist/release
          for TARGET in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            SLUG="${TARGET#bun-}"
            case "$SLUG" in
              windows-*) BIN=drangler.exe ;;
              *) BIN=drangler ;;
            esac
            bun build --compile --minify --target="$TARGET" --outfile "dist/build/${BIN}" src/cli.ts
            case "$SLUG" in
              windows-*)
                (cd dist/build && zip -q "../release/drangler-v${VERSION}-${SLUG}.zip" "$BIN")
                ;;
              *)
                chmod +x "dist/build/${BIN}"
                tar -czf "dist/release/drangler-v${VERSION}-${SLUG}.tar.gz" -C dist/build "$BIN"
                ;;
            esac
            rm -f "dist/build/${BIN}"
          done
          ls -l dist/release
      - name: Run the Binary This Runner Can Execute
        run: |
          tar -xzf "dist/release/drangler-v${VERSION}-linux-x64.tar.gz" -C dist/build
          REPORTED=$(dist/build/drangler --version)
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "::error::the compiled binary reports ${REPORTED} and package.json says ${VERSION}." >&2
            exit 1
          fi
          echo "drangler-v${VERSION}-linux-x64 runs and reports ${REPORTED}."
      - name: Checksum the Archives
        run: |
          cd dist/release
          sha256sum drangler-v${VERSION}-* > SHA256SUMS
          cat SHA256SUMS
      - name: Hand the Archives to the Release Job
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/release
          retention-days: 1
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: binaries

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Retrieve Latest Tag
        id: latest_tag
        run: |
          echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
      - name: Collect the Archives the Previous Job Built
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist/release
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: drangler v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          body: ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          files: |
            dist/release/drangler-v${{ env.VERSION }}-*.tar.gz
            dist/release/drangler-v${{ env.VERSION }}-*.zip
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: release

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read the Version and the Package Name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
      - name: Refuse to Publish an Untagged Version
        run: |
          TAG="v${VERSION}${{ github.event.inputs.suffix }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} does not exist, so the release job did not create it. Refusing to publish an untagged version." >&2
            exit 1
          fi
          echo "Publishing against ${TAG}."
      - name: Skip a Suffixed Release
        id: suffix
        run: |
          if [ -n "${{ github.event.inputs.suffix }}" ]; then
            echo "Suffix '${{ github.event.inputs.suffix }}' given; package.json says ${VERSION}, so npm and the tag would disagree. Skipping the publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Bun
        if: steps.suffix.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        if: steps.suffix.outputs.skip == 'false'
        run: bun install --frozen-lockfile
      - name: Verify the Gate Before Publishing
        if: steps.suffix.outputs.skip == 'false'
        run: |
          bun run typecheck
          bun run test
      - name: Check the Binary the Package Points At
        if: steps.suffix.outputs.skip == 'false'
        run: |
          bun run build:dist
          BIN=$(node -p "require('./package.json').bin.drangler")
          if [ ! -f "$BIN" ]; then
            echo "::error::package.json points bin.drangler at ${BIN} and build:dist did not produce it, so the published CLI would not run." >&2
            exit 1
          fi
          node "$BIN" --version
      - name: Set up Node for npm
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the Token Is Present
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on this repository. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
      - name: Check Whether the Version Is Already on the Registry
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm
        id: published
        run: |
          VERSIONS=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          if echo "$VERSIONS" | grep -q "\"${VERSION}\""; then
            echo "${PACKAGE}@${VERSION} is already on the registry; skipping the publish so a re-run is idempotent."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm && steps.published.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Publish to Job Summary
        if: always() && steps.suffix.outputs.skip == 'false'
        run: |
          echo "## npm publish" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${PACKAGE}@${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skip_npm }}" = "true" ]; then
            echo "- Result: skipped, skip_npm was set" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.published.outputs.skip }}" = "true" ]; then
            echo "- Result: skipped, already on the registry" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: published with provenance" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Set up Node for GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_github_npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@drupflare'
      - name: Check Whether the Version Is Already on GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_github_npm
        id: published_gh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          if echo "$VERSIONS" | grep -q "\"${VERSION}\""; then
            echo "${PACKAGE}@${VERSION} is already on GitHub Packages; skipping so a re-run is idempotent."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_github_npm && steps.published_gh.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
      - name: GitHub Packages to Job Summary
        if: always() && steps.suffix.outputs.skip == 'false'
        run: |
          echo "## GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${PACKAGE}@${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skip_github_npm }}" = "true" ]; then
            echo "- Result: skipped, skip_github_npm was set" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.published_gh.outputs.skip }}" = "true" ]; then
            echo "- Result: skipped, already on GitHub Packages" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: published" >> $GITHUB_STEP_SUMMARY
          fi

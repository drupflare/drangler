services:
  db:
    image: mariadb@sha256:ab1c3dd381940233af12512b97d47b508fd3a0f17fbe3ba388739b7bc17cbc0b
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupalpass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - '127.0.0.1:33306:3306'

  drupal:
    image: drupal@sha256:bae0ec3d22c3ba81e2c86807a08fc3706963654c71bd95aad841880bd0d255b7
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_NAME: drupal
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupalpass
      DRUPAL_SITE_MAIL: e2e@example.com
      SSH_USER: tester
      SSH_PUBLIC_KEY: ${DRANGLER_E2E_SSH_PUBKEY:-}
    entrypoint: ['/bin/bash', '/opt/drangler/entrypoint.sh']
    volumes:
      - ./drupal:/opt/drangler:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/opt/drangler-ready']
      interval: 5s
      timeout: 5s
      retries: 180
    ports:
      - '127.0.0.1:8180:80'
      - '127.0.0.1:2222:22'

  vps-broken:
    profiles: ['broken']
    image: drupal@sha256:bae0ec3d22c3ba81e2c86807a08fc3706963654c71bd95aad841880bd0d255b7
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_NAME: drupal
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupalpass
      SSH_USER: tester
      SSH_PUBLIC_KEY: ${DRANGLER_E2E_SSH_PUBKEY:-}
      DRANGLER_FAULT: ${DRANGLER_FAULT:-none}
    entrypoint: ['/bin/bash', '/opt/drangler/broken-entrypoint.sh']
    volumes:
      - ./drupal:/opt/drangler:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/opt/drangler-broken-ready']
      interval: 5s
      timeout: 5s
      retries: 180
    ports:
      - '127.0.0.1:8181:80'
      - '127.0.0.1:2223:22'
